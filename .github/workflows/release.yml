name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing brewfast release tag to package and publish (brewfast-v<version>)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing brewfast release tag to package and publish (brewfast-v<version>)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out brewfast
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Validate release version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#brewfast-v}"
          test "$TAG" = "brewfast-v$VERSION"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "error: tag $TAG does not encode a valid semver" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          # slug -> "GOOS GOARCH"; Go cross-compiles all targets on ubuntu.
          declare -A TARGETS=(
            [darwin-arm64]="darwin arm64"
            [darwin-x64]="darwin amd64"
            [linux-arm64]="linux arm64"
            [linux-x64]="linux amd64"
          )
          for slug in "${!TARGETS[@]}"; do
            read -r goos goarch <<<"${TARGETS[$slug]}"
            echo "Building $slug ($goos/$goarch)"
            workdir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build \
              -trimpath \
              -ldflags "-s -w -X github.com/amitray007/brewfast/cmd.version=${VERSION}" \
              -o "$workdir/brewfast" .
            # Reproducible tarball: sorted names, zeroed mtime/owner/group.
            tar \
              --sort=name \
              --mtime=@0 \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$workdir" \
              -czf "release/brewfast-${VERSION}-${slug}.tar.gz" \
              brewfast
            rm -rf "$workdir"
          done
          cd release
          sha256sum brewfast-"${VERSION}"-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Render and validate formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/render-formula.sh \
            "$VERSION" \
            release/SHA256SUMS \
            release/brewfast.rb
          ruby -c release/brewfast.rb

      - name: Create or update source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/brewfast-"$VERSION"-*.tar.gz \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              release/brewfast-"$VERSION"-*.tar.gz \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "brewfast v$VERSION" \
              --generate-notes
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: amitray007/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish public tap release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo amitray007/homebrew-tap >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/brewfast-"$VERSION"-*.tar.gz \
              release/SHA256SUMS \
              --repo amitray007/homebrew-tap \
              --clobber
          else
            gh release create "$TAG" \
              release/brewfast-"$VERSION"-*.tar.gz \
              release/SHA256SUMS \
              --repo amitray007/homebrew-tap \
              --title "brewfast v$VERSION" \
              --notes "Install with \`brew install amitray007/tap/brewfast\`. Source: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi

      - name: Update Homebrew formula on the tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp release/brewfast.rb homebrew-tap/Formula/brewfast.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/brewfast.rb
          if git diff --cached --quiet; then
            echo "Formula already points to brewfast $VERSION."
          else
            git commit -m "brewfast: release $VERSION"
            git push origin HEAD:main
          fi
